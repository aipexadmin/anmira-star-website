<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANMIRA STAR | 星曜幻鏡 電子名片</title>
    <style>
        /* 承襲官網：科技深黑宇宙與極簡文字 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #000000; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }

        /* 頂級毛玻璃質感卡片 (Glassmorphism) */
        .box { 
            text-align: center; 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 50px 30px; 
            border-radius: 28px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); 
            max-width: 90%; 
            width: 380px; 
        }

        /* 官網星曜光芒與品牌文字 */
        .logo-text { 
            color: #ffffff; 
            font-weight: 300; 
            font-size: 13px; 
            letter-spacing: 4px; 
            margin-bottom: 25px; 
            text-transform: uppercase; 
            opacity: 0.8;
        }
        
        h2 { 
            margin: 0 0 10px 0; 
            color: #ffffff; 
            font-size: 24px; 
            font-weight: 500;
            letter-spacing: 1px;
        }
        
        p { 
            color: #8e8e93; 
            font-size: 13px; 
            margin-bottom: 35px; 
            line-height: 1.6; 
            font-weight: 300;
        }

        /* 響應式主核心按鈕：純白與透明框格交織 */
        .btn { 
            display: block; 
            background: #ffffff; 
            color: #000000; 
            text-decoration: none; 
            padding: 15px; 
            border-radius: 50px; 
            font-weight: 600; 
            margin-bottom: 15px; 
            font-size: 15px; 
            letter-spacing: 1px;
            transition: all 0.3s ease; 
        }
        .btn:hover { 
            background: #e5e5ea;
            transform: translateY(-2px);
        }
        
        /* 輔助按鈕：極簡鏤空邊框 */
        .btn-sub { 
            background: transparent; 
            color: #ffffff; 
            border: 1px solid rgba(255, 255, 255, 0.3); 
        }
        .btn-sub:hover { 
            background: rgba(255, 255, 255, 0.08); 
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="logo-text">ANMIRA STAR · 星曜幻鏡</div>
        <h2 id="user-name">正在接入幻境...</h2>
        <p>手機正在自動同步聯絡人資料。<br>點擊下方按鈕可手動儲存或訪問官網。</p>
        
        <!-- 操控鈕 -->
        <a href="#" id="vcf-link" class="btn">📥 儲存聯絡資訊</a>
        <a href="https://anmirastar.com/" class="btn btn-sub">🌐 進入官方網站</a>
    </div>

    <script>
        // 1. 解析網址後綴 ?name= 參數
        const urlParams = new URLSearchParams(window.location.search);
        let name = urlParams.get('name') || 'susan';
        name = name.toLowerCase();
        
        // 2. 依參數精準賦予對應人名
        if (name === 'susan') {
            document.getElementById('user-name').innerText = "王佩瑜 Susan Wang";
        } else {
            // 自動將首字母大寫，維持極簡美感
            document.getElementById('user-name').innerText = name.toUpperCase() + " 的電子名片";
        }
        
        // 3. 綁定動態 VCF 檔案連結
        const vcfPath = `./files/${name}.vcf`;
        document.getElementById('vcf-link').href = vcfPath;

        // 4. 一秒觸發原生下載機制
        window.onload = function() {
            setTimeout(() => {
                const link = document.createElement('a');
                link.href = vcfPath;
                link.download = `${name}.vcf`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }, 450);
        };
    </script>

</body>
</html>
